<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Leafhopper: the pest that alternates a long stillness with a short covering
       leap rather than walking at one steady pace (Pest.SPECIES[HOPPER]). Drawn
       coiled, the big bent hind legs are the tell, the same spring a real
       hopper cocks before it jumps, because the sprite has to say the
       mechanic in one still frame; nothing here animates differently between
       the crouch and the leap. Top-down, walks up-screen (-Y), Red/pest family
       throughout, matching the aphid and the Shield Bug it is a cousin of. -->

  <!-- front legs (behind the body), small like the aphid's -->
  <g stroke="#AF392D" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M27 26 L18 22"/>
    <path d="M37 26 L46 22"/>
  </g>

  <!-- the coiled hind legs: bent sharply at the knee, the spring the mechanic
       reads off. Thicker than every other leg on the board, on purpose. -->
  <g stroke="#AF392D" stroke-width="3.4" stroke-linecap="round" fill="none">
    <path d="M25 40 L13 46 L19 58"/>
    <path d="M39 40 L51 46 L45 58"/>
  </g>

  <!-- antennae -->
  <g stroke="#AF392D" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M29 15 Q 24 9 20 8"/>
    <path d="M35 15 Q 40 9 44 8"/>
  </g>
  <circle cx="20" cy="8" r="1.6" fill="#AF392D"/>
  <circle cx="44" cy="8" r="1.6" fill="#AF392D"/>

  <!-- abdomen: leaner than the aphid's, tapering toward the tail -->
  <path d="M32 26 Q 43 30 41 42 Q 39 54 32 58 Q 25 54 23 42 Q 21 30 32 26 Z"
        fill="#E74C3C" stroke="#AF392D" stroke-width="2"/>
  <path d="M32 33 L32 52" stroke="#AF392D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="32" cy="17" r="7" fill="#D24536" stroke="#AF392D" stroke-width="2"/>
  <circle cx="29" cy="15.5" r="2.1" fill="#FFFFFF"/>
  <circle cx="35" cy="15.5" r="2.1" fill="#FFFFFF"/>
  <circle cx="29" cy="15.5" r="1.05" fill="#7A2820"/>
  <circle cx="35" cy="15.5" r="1.05" fill="#7A2820"/>
</svg>
