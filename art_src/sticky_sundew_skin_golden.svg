  <!-- Sticky Sundew: the fourth plant, control not combat. A top-down rosette of
       six spoon-shaped paddles, each strung with two dew beads.

       Two deliberate departures from the other three plants, so it is not read as
       "a green sunflower" at 64px:
         * six broad clubs, not twelve narrow petals — a rosette silhouette rather
           than a flower's, with the gaps between paddles wide enough to see grass
           through.
         * the beads use the blue-grey family (#758C8E / #89A4A6 / #A3C3C6), which
           nothing else in this garden touches. Corn and Sunflower are gold, Chomp
           is green-and-maw-red, the pests are red and carapace grey. The dew is
           the only pale-blue thing on the board, and it is the same hue the plant
           paints its patch on the ground in.

       Every material is three values at most — dark rim / base / light facet —
       per STYLE.md, and each outline is that shape's own hue darkened, never
       black. Geometry is pinned by the sprite gate as much as by the drawing:
         * the paddle reaches y = -24 with a 2px rim, so the content box is
           x 8.8..55.2, y 7..57 — centred on x = 32 to well inside the 1px the
           bilateral-axis check allows, with 7px of margin at the tightest edge.
         * every bead sits entirely INSIDE its paddle's fill (bead A clears the
           tip curve by ~1.3px, bead B clears the crown's rim by ~1.3px), so no
           pixel ever mixes bead grey, paddle green and a dark rim at once. Three
           unrelated hues meeting in one anti-aliased pixel is the one way a
           palette-conformant drawing fails the palette test.
         * the two beads on a paddle may touch — they share a rim colour, so that
           junction is still only two hues deep. -->

