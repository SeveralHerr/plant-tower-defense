  <!-- Garden Mint: the sixth plant, and the first that acts on other PLANTS rather than on
       pests. Drawn as a low bushy clump of paired leaves rather than a single bloom, because
       every other plant in the catalogue has one obvious business end pointing at the lane
       (a cob, a mouth, a disc, a sticky pad, a seed head) and this one has none — it should
       read as ground cover, not as a weapon.

       Palette: BLUE-GREY for the leaves, Foliage green for the stems only. The first cut
       used Foliage green for the leaves and it was unreadable on the board — GardenTheme.LEAF
       is Color(0.180, 0.800, 0.443), which is #2ECC71 exactly, so the sprite was drawn in the
       lawn's own hue and vanished into it. A screenshot is what caught that; no gate compares
       a sprite against the ground it stands on.

       Blue-grey is the right answer rather than merely a different one: mint leaves really are
       paler and cooler than grass, so the contrast that makes it legible is also the thing
       that makes it recognisable. Every other plant already contrasts by hue (gold cob, red
       maw, gold disc), and this is the family that does it without inventing a colour. -->

  <!-- Stems, drawn first so the leaves sit over their joins. Three, splayed, none vertical:
       a vertical stem would put a hard line down the middle of the tile and read as a stalk
       plant like the Sunflower. -->
  <g transform="translate(32,32)" stroke="#597A0B" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M0 22 Q -2 8 -9 -2"/>
    <path d="M0 22 Q 1 6 2 -8"/>
    <path d="M0 22 Q 3 8 11 -1"/>
  </g>

  <!-- Six leaves in opposite pairs, which is what mint actually does and reads as
       deliberate rather than as a generic bush. Each pair is drawn as one group and
       mirrored, so the clump is symmetric about the vertical axis the way Chomp Flower's
       leaves are. -->
  <g transform="translate(32,32)" stroke="#709A0E" stroke-width="1.8" stroke-linejoin="round" fill="#9DD618">

    <!-- top pair, smallest, the tip of the clump -->
    <g transform="translate(2,-13)">
      <path d="M0 0 Q -6 -5 -11 -1 Q -6 4 0 0 Z"/>
      <path d="M0 0 Q 6 -5 11 -1 Q 6 4 0 0 Z"/>
      <path d="M-1.5 -0.4 Q -5 -1.2 -9 -0.8" fill="none" stroke="#709A0E" stroke-width="1.2"/>
      <path d="M1.5 -0.4 Q 5 -1.2 9 -0.8" fill="none" stroke="#709A0E" stroke-width="1.2"/>
    </g>

    <!-- middle pair, widest, the part that carries the silhouette -->
    <g transform="translate(0,0)">
      <path d="M0 0 Q -8 -7 -15 -1 Q -8 6 0 0 Z"/>
      <path d="M0 0 Q 8 -7 15 -1 Q 8 6 0 0 Z"/>
      <path d="M-2 -0.5 Q -7 -1.6 -12.5 -1" fill="none" stroke="#709A0E" stroke-width="1.3"/>
      <path d="M2 -0.5 Q 7 -1.6 12.5 -1" fill="none" stroke="#709A0E" stroke-width="1.3"/>
    </g>

    <!-- lower pair, sitting on the ground line, in the mid foliage tone so the clump has
         depth rather than reading as one flat shape -->
    <g transform="translate(-1,12)" fill="#88BA12">
      <path d="M0 0 Q -7 -6 -13 -1 Q -7 5 0 0 Z"/>
      <path d="M0 0 Q 7 -6 13 -1 Q 7 5 0 0 Z"/>
      <path d="M-2 -0.4 Q -6 -1.4 -11 -0.9" fill="none" stroke="#709A0E" stroke-width="1.2"/>
      <path d="M2 -0.4 Q 6 -1.4 11 -0.9" fill="none" stroke="#709A0E" stroke-width="1.2"/>
    </g>
  </g>
