<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Aphid Queen: the boss pest. Top-down, walks up-screen (-Y).

       Two marks nothing else in the game wears, and both of them are the
       mechanic rather than decoration:
         * the gold crown — the only non-red thing on any pest, so a queen is
           picked out of a swarm of her own colour at a glance;
         * the three eggs on the brood sac — she bursts into exactly three
           aphids when she dies (Pest.SPECIES[QUEEN].split_count), so the
           sprite counts them out before the player finds out the hard way.
       Same red/pest palette family as the aphid, one size class up. -->

  <!-- legs (behind the body) -->
  <g stroke="#AF392D" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M21 30 L8 24"/>
    <path d="M19 39 L6 39"/>
    <path d="M21 48 L8 54"/>
    <path d="M43 30 L56 24"/>
    <path d="M45 39 L58 39"/>
    <path d="M43 48 L56 54"/>
  </g>

  <!-- antennae -->
  <g stroke="#AF392D" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M27 16 Q 22 11 19 10"/>
    <path d="M37 16 Q 42 11 45 10"/>
  </g>

  <!-- crown -->
  <path d="M23 13 L26 6 L29 11 L32 4 L35 11 L38 6 L41 13 Z"
        fill="#FFCC00" stroke="#C29A00" stroke-width="2" stroke-linejoin="round"/>

  <!-- brood sac -->
  <ellipse cx="32" cy="39" rx="17" ry="16" fill="#E74C3C" stroke="#AF392D" stroke-width="2"/>

  <!-- the three eggs she bursts into -->
  <g fill="#D24536" stroke="#AF392D" stroke-width="1.5">
    <ellipse cx="25" cy="37" rx="4" ry="5"/>
    <ellipse cx="39" cy="37" rx="4" ry="5"/>
    <ellipse cx="32" cy="47" rx="4" ry="5"/>
  </g>

  <!-- head -->
  <circle cx="32" cy="19" r="9.5" fill="#D24536" stroke="#AF392D" stroke-width="2"/>
  <circle cx="28" cy="17.5" r="2.6" fill="#FFFFFF"/>
  <circle cx="36" cy="17.5" r="2.6" fill="#FFFFFF"/>
  <circle cx="28" cy="17.5" r="1.3" fill="#7A2820"/>
  <circle cx="36" cy="17.5" r="1.3" fill="#7A2820"/>
</svg>
