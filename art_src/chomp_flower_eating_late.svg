<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Chomp Flower, late in a long chew. A beetle's 2.6s chew_seconds is long
       enough to read a second bite frame, not just one fixed picture for the
       whole meal — swapped in past chew_progress() > 0.6, the same threshold
       the shrinking chew ring already reads (see ChompFlower._show_eating_sprite).
       Interpolated between chomp_flower_eating.svg (mouth wide, meal just
       grabbed) and chomp_flower.svg (idle, mouth closed): the maw is closing
       back down and almost nothing of the meal is left. -->

  <!-- leaves poking out below the petal ring -->
  <g transform="translate(32,32)" stroke="#1F8A4C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <g transform="rotate(125)">
      <path d="M6 0 Q 19 -9 31 -1 Q 19 8 6 0 Z" fill="#2ECC71"/>
      <path d="M9 -0.5 Q 20 -2 29 -1.5" fill="none" stroke-width="1.4"/>
    </g>
    <g transform="rotate(55)">
      <path d="M6 0 Q 19 -9 31 -1 Q 19 8 6 0 Z" fill="#2ECC71"/>
      <path d="M9 -0.5 Q 20 -2 29 -1.5" fill="none" stroke-width="1.4"/>
    </g>
  </g>

  <!-- petal ring: same squashed posture as the mid-bite frame — still
       visibly mid-chew, not back to idle -->
  <g fill="#FFCC00" stroke="#C29A00" stroke-width="2">
    <g transform="rotate(0 32 32)"><ellipse cx="32" cy="16" rx="7.5" ry="5.2"/></g>
    <g transform="rotate(40 32 32)"><ellipse cx="32" cy="16" rx="7.5" ry="5.2"/></g>
    <g transform="rotate(80 32 32)"><ellipse cx="32" cy="16" rx="7.5" ry="5.2"/></g>
    <g transform="rotate(120 32 32)"><ellipse cx="32" cy="16" rx="7.5" ry="5.2"/></g>
    <g transform="rotate(160 32 32)"><ellipse cx="32" cy="16" rx="7.5" ry="5.2"/></g>
    <g transform="rotate(200 32 32)"><ellipse cx="32" cy="16" rx="7.5" ry="5.2"/></g>
    <g transform="rotate(240 32 32)"><ellipse cx="32" cy="16" rx="7.5" ry="5.2"/></g>
    <g transform="rotate(280 32 32)"><ellipse cx="32" cy="16" rx="7.5" ry="5.2"/></g>
    <g transform="rotate(320 32 32)"><ellipse cx="32" cy="16" rx="7.5" ry="5.2"/></g>
  </g>

  <!-- maw, closing back down (14 vs the mid-bite frame's 16, idle's 13) -->
  <circle cx="32" cy="32" r="14" fill="#AF392D" stroke="#8C2D24" stroke-width="2"/>
  <circle cx="32" cy="32" r="6" fill="#7A2820"/>

  <!-- the meal: almost nothing left of it -->
  <ellipse cx="32" cy="32.5" rx="2" ry="2.5" fill="#D24536" stroke="#AF392D" stroke-width="1.2"/>

  <!-- teeth, drawing back in toward idle spacing as the bite closes -->
  <g fill="#FFFFFF">
    <g transform="rotate(0 32 32)"><path d="M26 19.5 L38 19.5 L32 27 Z"/></g>
    <g transform="rotate(45 32 32)"><path d="M26 19.5 L38 19.5 L32 27 Z"/></g>
    <g transform="rotate(90 32 32)"><path d="M26 19.5 L38 19.5 L32 27 Z"/></g>
    <g transform="rotate(135 32 32)"><path d="M26 19.5 L38 19.5 L32 27 Z"/></g>
    <g transform="rotate(180 32 32)"><path d="M26 19.5 L38 19.5 L32 27 Z"/></g>
    <g transform="rotate(225 32 32)"><path d="M26 19.5 L38 19.5 L32 27 Z"/></g>
    <g transform="rotate(270 32 32)"><path d="M26 19.5 L38 19.5 L32 27 Z"/></g>
    <g transform="rotate(315 32 32)"><path d="M26 19.5 L38 19.5 L32 27 Z"/></g>
  </g>
</svg>
