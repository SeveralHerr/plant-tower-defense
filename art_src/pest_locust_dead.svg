<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Locust, dead: same body, X eyes instead of a tint, the pattern every
       other pest's corpse uses (see pest_aphid_dead.svg). Swapped in by
       Pest._play_death(). -->

  <!-- legs (behind the body) -->
  <g stroke="#AF392D" stroke-width="2.3" stroke-linecap="round" fill="none">
    <path d="M24 28 L14 24"/>
    <path d="M23 36 L12 37"/>
    <path d="M25 44 L15 49"/>
    <path d="M40 28 L50 24"/>
    <path d="M41 36 L52 37"/>
    <path d="M39 44 L49 49"/>
  </g>

  <!-- antennae -->
  <g stroke="#AF392D" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M29 14 Q 24 9 20 8"/>
    <path d="M35 14 Q 40 9 44 8"/>
  </g>
  <circle cx="20" cy="8" r="1.6" fill="#AF392D"/>
  <circle cx="44" cy="8" r="1.6" fill="#AF392D"/>

  <!-- head -->
  <circle cx="32" cy="17" r="7" fill="#D24536" stroke="#AF392D" stroke-width="2"/>

  <!-- abdomen, under the folded wings -->
  <ellipse cx="32" cy="40" rx="9" ry="14" fill="#E74C3C" stroke="#AF392D" stroke-width="2"/>

  <!-- the folded wings -->
  <path d="M32 24 L20 30 Q 16 42 24 56 L32 52 Z"
        fill="#89A4A6" stroke="#758C8E" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32 24 L44 30 Q 48 42 40 56 L32 52 Z"
        fill="#89A4A6" stroke="#758C8E" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#758C8E" stroke-width="1.2" stroke-linecap="round" fill="none">
    <path d="M25 32 L27 50"/>
    <path d="M39 32 L37 50"/>
  </g>

  <!-- X eyes, drawn last so they sit on top of the head -->
  <g stroke="#7A2820" stroke-width="1.6" stroke-linecap="round">
    <path d="M27 13.5 L30.6 17.1"/>
    <path d="M30.6 13.5 L27 17.1"/>
    <path d="M33.4 13.5 L37 17.1"/>
    <path d="M37 13.5 L33.4 17.1"/>
  </g>
</svg>
