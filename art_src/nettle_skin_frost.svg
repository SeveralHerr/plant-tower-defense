<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- GENERATED by tools/gen_skin_svg.py from nettle.svg, family frost. Do not edit by hand:
       run `python tools/gen_skin_svg.py` and it reports any edit the parent and the
       frost ramp do not explain. Parent geometry is copied verbatim, paint is remapped
       onto the ramp, and the family motif is the appended group at the end. -->
  <!-- Prickly Nettle: the seventh plant, and the first that REFUSES a target. It stings a
       pest the mutations changed and lets everything else walk past, so the drawing has one
       job the other six do not have — it has to look like it hurts, at 64px, on grass.

       SILHOUETTE. An upright square stem with opposite leaf pairs, each leaf saw-toothed and
       studded with bristles that poke out past its own edge. That is the one shape a nettle
       has and nothing else in this garden does: Chomp and Sundew are rosettes, Corn and
       Sunflower and Dandelion are heads on a stalk, Mint is a low clump. The tooth-and-bristle
       edge is the whole read, and it survives being shrunk because it changes the OUTLINE
       rather than the interior.

       PALETTE, and this is the decision worth writing down. Orange (#C25000 / #FF6600 /
       #FF9C3C) for the leaves, Foliage green for the stem only.

       The obvious cut is green, and green is the trap Garden Mint already paid for once
       (art_src/mint.svg:8 has the post-mortem): GardenTheme.LEAF is Color(0.180, 0.800,
       0.443), which is #2ECC71 exactly, so a plant drawn in the kit's Foliage green base is
       drawn in the lawn's own hue and disappears into it. The near miss is no better here.
       The palette's only other greens are #229C56 and #1F8A4C, which sit 0.4 degrees of hue
       from #2ECC71 and differ from it in LUMINANCE alone (125 and 111 against 164) — that is
       a one-channel cue on the one plant whose whole point is that you can tell at a glance
       whether it is doing anything.

       So the leaves leave the family. Orange is the only role in art_src/STYLE.md's table
       that NO sprite in assets/sprites/ uses — it is listed as "Orange (fx)" and the fx never
       got drawn — and it is the complement of the lawn, so the contrast is the maximum the
       contract allows rather than merely a different choice. It also happens to be what the
       palette already means by "this stings": the row is the effects row.

       Blue-grey and Red were the two other free-ish families and both are taken in the sense
       that matters. Blue-grey is Sundew's dew and Mint's leaves. Red is what every pest in
       the game is drawn in (art_src/pest_aphid.svg, pest_beetle.svg), and a red plant on a
       board of red bugs is a plant the player mistakes for a target.

       ANTI-ALIASING. Only two hues ever meet: the bristles are drawn in the leaf's OWN rim
       colour, so a bristle crossing the rim and poking out into transparency never puts a
       third colour in a blended pixel. The stem is drawn first and the leaf bases sit over
       it, and the 1.8px rim keeps the green and the orange fill more than a pixel apart
       everywhere they cross. That is the failure mode art_src/sticky_sundew.svg's header
       describes and it is the one thing this file cannot check for itself. -->

  <!-- Stem first, so the leaf bases cover where they join it. A single upright, which the
       other clump-shaped plants deliberately avoid (art_src/mint.svg:19 refuses a vertical
       stem for reading as a stalk plant) — here it is wanted, because a nettle IS a stalk
       and the pairs hanging off it are half of what names the plant. -->
  <g transform="translate(32,32)" stroke="#2896CD" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M0 22 L0 -6"/>
  </g>

  <!-- Two opposite pairs. Each pair is one group holding the same leaf twice, at theta and
       at 180 minus theta: the leaf is symmetric about its own long axis, and for a shape
       with that property rotate(180 - theta) IS the mirror of rotate(theta). Same trick
       art_src/dandelion.svg uses for its rotate(70)/rotate(110) pair, and for the same
       reason — test_sprite_style.gd measures the rendered content box against x = 32, so an
       approximate mirror is a failed render rather than a slightly wonky plant.

       The bristles inside each leaf are mirrored about the leaf's own axis for exactly that
       reason too: a bristle on one edge only would break the axis symmetry the trick rests
       on, and the failure would appear as an off-centre content box with nothing in the
       diff to explain it. -->
  <g transform="translate(32,32)" fill="#50B3E4" stroke="#147BAF" stroke-width="1.8"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- Upper pair, held higher and swept up, in the family's LIGHT shade — the depth cue
         goes on a whole leaf rather than into a highlight facet inside one. STYLE.md allows
         a facet and this drawing declines it: the saw-tooth outline pinches to 2.5px of
         half-width between teeth, so an inset facet would sit inside a pixel of the 1.8px
         rim and put facet, fill and rim in one anti-aliased pixel — the exact junction
         art_src/sticky_sundew.svg's header spends a paragraph engineering away. Two whole
         leaves at two values says the same thing with no junction at all, which is also what
         art_src/mint.svg:50 does with its lower pair. -->
    <g transform="translate(0,-6)" fill="#87CEF2">
      <g transform="rotate(-32)">
        <path d="M0 0 L5 -4 L8 -2.5 L11 -5.5 L14 -3 L16.5 -4.5 L18 0 L16.5 4.5 L14 3 L11 5.5 L8 2.5 L5 4 Z"/>
        <path d="M8 -3 L8.4 -7 M8 3 L8.4 7 M12.5 -4.6 L13.4 -8.4 M12.5 4.6 L13.4 8.4 M16 -3 L17.2 -6.2 M16 3 L17.2 6.2"
              fill="none" stroke="#147BAF" stroke-width="1"/>
      </g>
      <g transform="rotate(212)">
        <path d="M0 0 L5 -4 L8 -2.5 L11 -5.5 L14 -3 L16.5 -4.5 L18 0 L16.5 4.5 L14 3 L11 5.5 L8 2.5 L5 4 Z"/>
        <path d="M8 -3 L8.4 -7 M8 3 L8.4 7 M12.5 -4.6 L13.4 -8.4 M12.5 4.6 L13.4 8.4 M16 -3 L17.2 -6.2 M16 3 L17.2 6.2"
              fill="none" stroke="#147BAF" stroke-width="1"/>
      </g>
    </g>

    <!-- lower pair, nearly level, and the widest thing on the canvas -->
    <g transform="translate(0,8)">
      <g transform="rotate(-8)">
        <path d="M0 0 L5 -4 L8 -2.5 L11 -5.5 L14 -3 L16.5 -4.5 L18 0 L16.5 4.5 L14 3 L11 5.5 L8 2.5 L5 4 Z"/>
        <path d="M8 -3 L8.4 -7 M8 3 L8.4 7 M12.5 -4.6 L13.4 -8.4 M12.5 4.6 L13.4 8.4 M16 -3 L17.2 -6.2 M16 3 L17.2 6.2"
              fill="none" stroke="#147BAF" stroke-width="1"/>
      </g>
      <g transform="rotate(188)">
        <path d="M0 0 L5 -4 L8 -2.5 L11 -5.5 L14 -3 L16.5 -4.5 L18 0 L16.5 4.5 L14 3 L11 5.5 L8 2.5 L5 4 Z"/>
        <path d="M8 -3 L8.4 -7 M8 3 L8.4 7 M12.5 -4.6 L13.4 -8.4 M12.5 4.6 L13.4 8.4 M16 -3 L17.2 -6.2 M16 3 L17.2 6.2"
              fill="none" stroke="#147BAF" stroke-width="1"/>
      </g>
    </g>
  </g>
  <g id="skin_motif_frost" stroke-linejoin="round" stroke-linecap="round">
    <g fill="#87CEF2" stroke="#0C618C" stroke-width="1.4">
