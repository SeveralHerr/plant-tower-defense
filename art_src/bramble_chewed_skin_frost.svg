      <path d="M-21 12 Q-2 -3 21 10"/>
      <path d="M-19 18 Q2 4 21 16"/>
    </g>

    <!-- Half the thorns, and the ones kept are the outer pairs: a chewed edge loses its
         middle first, and keeping the outermost preserves the spiky silhouette that names
         the plant. -->
    <g fill="none" stroke="#50B3E4" stroke-width="1.6" stroke-linecap="round">
