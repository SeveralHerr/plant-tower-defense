       onto the ramp, and the family motif is the appended group at the end. -->
  <!-- Barrier Bramble, second of three frames: bitten but holding. Read art_src/bramble.svg
       first; everything about palette and about reading against the ROAD (a flat #BB8044,
       measured off towerDefense_tile050.png) is decided there and is not repeated.

       WHAT CHANGES, AND WHAT MAY NOT. Three constraints bound every frame in this set and
       all three are gates, not preferences:

         * BILATERAL CENTRING. test_content_is_bilaterally_centred measures the rendered
           content box midpoint against x = 32 with a 1.0 px tolerance. So damage is taken
           SYMMETRICALLY. Breaking one cane and leaving the other would read beautifully and
           fail the gate, and the failure would look like a rendering fault rather than a
           drawing decision.
         * THE STEM PIVOT. test_the_stem_pivot_is_the_bottom_of_the_art_not_the_bottom_of_
           the_png measures each sprite's painted base against Plant.STEM_PIVOT_Y inside a
           2 px family spread. So the canes are chewed from the TOP and the MIDDLE, never
           from the bottom: their end points stay where the whole frame put them. That is
           also the better drawing, since a bramble eaten down still sits on the ground.
         * THE PALETTE. Same two families as the whole frame, no third.

       THE PROGRESSION, stated once here for all three: whole (an arch plus a back arch,
       five leaves), chewed (the back arch gone, fewer thorns, three leaves), ragged (the
       arch bitten through in the middle). Each step removes rather than redraws, so the
       three read as one plant at three moments instead of three drawings. -->

  <!-- No back arch. It was the depth cue in the whole frame and it is the first thing to
       go: losing a whole element reads at 64 px where thinning a stroke does not. -->

  <!-- The two front canes, narrowed symmetrically from 24 to 21 and flattened. Same round
       caps at the same y, so the painted base does not move. -->
  <g transform="translate(32,36)">
