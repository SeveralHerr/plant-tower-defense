  <!-- GENERATED by tools/gen_skin_svg.py from bramble.svg, family golden. Do not edit by hand:
       run `python tools/gen_skin_svg.py` and it reports any edit the parent and the
       golden ramp do not explain. Parent geometry is copied verbatim, paint is remapped
       onto the ramp, and the family motif is the appended group at the end. -->
  <!-- Barrier Bramble: the ninth plant, and the only one in the game that does not stand on
       grass. That single fact changes the palette question completely and it is the whole
       reason this header is here.

       THE BACKGROUND IS DIFFERENT, AND IT WAS MEASURED. Every other plant in art_src/ was
       drawn to read against the lawn, and two of them (art_src/mint.svg:8,
       art_src/nettle.svg:16) carry post-mortems about the trap: GardenTheme.LEAF is
       #2ECC71 exactly, the kit's Foliage green base, so a green plant on grass vanishes.
       This one is placed by PlantCatalog's "on_road" key and can ONLY ever sit on a road
       cell, so the surface behind it is towerDefense_tile050.png — which was sampled
       rather than guessed and is a FLAT #BB8044 across all 4096 pixels, no texture, no
       second colour.

       So the trap here points at a different family. Dirt/seed is #A8723B / #C48647 /
       #D9944E, and #C48647 against a #BB8044 ground is a nine-point separation on the
       red channel and nothing anywhere else — the identical failure Mint had with green,
       one material over. The brown family is exactly what a bramble "should" be drawn in
       and it is the one family this sprite may not use.

       PALETTE, decided against that ground. Sand/paper (#A69B81 / #ECDCB8 / #FFEDC6) for
       the woody canes, Foliage green (#1F8A4C / #2ECC71 / #31D978) for the few live
       leaves.

       The canes carry the read and they carry it on LUMINANCE, which is the one channel
       that survives every kind of colour blindness and also survives the sprite being
       shrunk. #ECDCB8 is luminance 215 against the road's 139 — a 76-point step, the
       largest any palette row offers over this ground without going to flat white. Gold
       (#FFCC00, 196) is the runner-up and is Corn's whole identity. Blue-grey is Sundew's
       dew and Mint's leaves. Stone is what every carapace in the game is drawn in, and a
       grey lump on the road is a rock the player walks pests around in their head.

       Foliage green is SAFE here, and only here, precisely because this plant is never on
       the lawn: on #BB8044 the same green that disappears over grass is a near-complement.
       It is used for the leaves only — a few of them, small — because the sprite still has
       to say "plant" from across the board, and a pile of pale sticks does not.

       SILHOUETTE. A low, wide tangle: two arched canes crossing the cell horizontally with
       thorns along their tops, and a third shorter arch behind. Wide rather than tall, and
       that is the one shape decision that matters — this plant's meaning is "the road is
       closed", so it reads across the lane rather than up it. Nothing else in the garden
       is horizontal: Corn, Sunflower and Dandelion are heads on a stalk, Nettle is an
       upright stem, Chomp and Sundew and Aloe are rosettes, Mint is a low clump but a
       round one.

       ANTI-ALIASING. Two hues meet in exactly one place — where a leaf sits on a cane —
       and the leaves are drawn OVER the canes with their own 1.2px rim, so the blended
       pixels are leaf-rim against cane-fill, two colours, never three. The thorns are
       drawn in the cane's own rim colour for the same reason art_src/nettle.svg draws its
       bristles in the leaf's rim: a spike crossing the outline and poking into
       transparency then never puts a third colour in a blended pixel. -->

  <!-- 33, and the number is set by a test rather than by eye. Plant.STEM_PIVOT_Y is where
       every plant's sway pivots, and test_the_stem_pivot_is_the_bottom_of_the_art_not_the
       _bottom_of_the_png measures each sprite's painted BASE against it inside a 2px
       family spread — the eight existing plants land at 24 to 27. A first draft of this
       file used translate(32,27), reasoning about vertical centring, and measured a base
       of 19: six pixels high, so the whole tangle would have swayed about a point in its
       own middle instead of about the ground. Six down puts it at 25, the middle of the
       family. Horizontal centring is unaffected; the bilateral check reads 31.5 of 32. -->
  <g transform="translate(32,33)">

    <!-- Back arch first, in the DARK sand value, so the tangle has a depth cue that is a
         whole cane at a lower value rather than a facet inside one. Same device
         art_src/nettle.svg uses for its two leaf pairs, and for the same reason: a facet
         inset into a 3px-wide stroked arch would put facet, fill and rim inside one
         anti-aliased pixel. -->
    <g fill="none" stroke="#D0A218" stroke-width="4.2" stroke-linecap="round">
      <path d="M-21 6 Q0 -12 21 6"/>
    </g>

    <!-- The two front canes. Drawn as stroked arcs rather than filled outlines: at 4.6px
         the stroke IS the cane, and a filled path with a separate rim would need the rim
         to be under a pixel wide to leave the same body. -->
    <g fill="none" stroke="#F5D36E" stroke-width="4.6" stroke-linecap="round">
      <path d="M-24 12 Q-2 -6 22 10"/>
      <path d="M-22 18 Q2 2 24 16"/>
    </g>

    <!-- Thorns, in the canes' own rim colour. Short straight spikes off the upper edge of
         each front cane, alternating side to side so the silhouette is spiky rather than
         combed. 1.6px so they read at 64 and still exist at half that. -->
    <g fill="none" stroke="#D0A218" stroke-width="1.6" stroke-linecap="round">
      <path d="M-17 6.5 L-19 1 M-8 -1.5 L-9 -7 M1 -4 L1 -9.5 M10 -1 L12 -6.5 M18 4 L21 -0.5"/>
      <path d="M-14 14 L-16 9.5 M-4 8 L-5 3 M6 6 L6.5 1 M15 9 L17.5 4.5"/>
    </g>

    <!-- Live leaves. Five, small, and only on the front canes, so the green never has to
         hold the shape on its own — see the header. Each is the same rounded blade at a
         different anchor and angle; the shape is symmetric about its own long axis, so
         mirroring is a rotation, which is what art_src/nettle.svg's pairs rely on. -->
    <g fill="#E8BC37" stroke="#8C6B09" stroke-width="1.2" stroke-linejoin="round">
      <g transform="translate(-12,3) rotate(-124)">
        <path d="M0 0 Q4 -3.4 8.5 0 Q4 3.4 0 0 Z"/>
      </g>
      <g transform="translate(-3,-3) rotate(-96)">
        <path d="M0 0 Q4 -3.4 8.5 0 Q4 3.4 0 0 Z"/>
      </g>
      <g transform="translate(7,-2.5) rotate(-64)">
        <path d="M0 0 Q4 -3.4 8.5 0 Q4 3.4 0 0 Z"/>
      </g>
      <g transform="translate(-9,16) rotate(118)">
        <path d="M0 0 Q4 -3.4 8.5 0 Q4 3.4 0 0 Z"/>
      </g>
      <g transform="translate(12,13) rotate(58)">
        <path d="M0 0 Q4 -3.4 8.5 0 Q4 3.4 0 0 Z"/>
      </g>
    </g>
  </g>
