<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Aphid Queen, dead: same body, X eyes, legs splayed flat — the corpse
       sprite Pest._play_death() swaps in.

       The brood sac is drawn SPLIT: the three eggs are gone and a seam runs
       down the middle of it, because by the time this sprite is on screen the
       three aphids it counted are already walking (Game._spawn_brood). A
       corpse still carrying its eggs would say the opposite of what happened. -->

  <!-- legs (behind the body), splayed flatter than idle -->
  <g stroke="#AF392D" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M21 33 L7 30"/>
    <path d="M19 39 L6 39"/>
    <path d="M21 45 L7 48"/>
    <path d="M43 33 L57 30"/>
    <path d="M45 39 L58 39"/>
    <path d="M43 45 L57 48"/>
  </g>

  <!-- antennae, drooped -->
  <g stroke="#AF392D" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M27 16 Q 21 14 18 15"/>
    <path d="M37 16 Q 43 14 46 15"/>
  </g>

  <!-- crown -->
  <path d="M23 13 L26 6 L29 11 L32 4 L35 11 L38 6 L41 13 Z"
        fill="#FFCC00" stroke="#C29A00" stroke-width="2" stroke-linejoin="round"/>

  <!-- burst brood sac -->
  <ellipse cx="32" cy="39" rx="17" ry="16" fill="#E74C3C" stroke="#AF392D" stroke-width="2"/>
  <g stroke="#AF392D" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M32 24 L32 54"/>
    <path d="M32 32 L24 38"/>
    <path d="M32 32 L40 38"/>
    <path d="M32 44 L25 48"/>
    <path d="M32 44 L39 48"/>
  </g>

  <!-- head -->
  <circle cx="32" cy="19" r="9.5" fill="#D24536" stroke="#AF392D" stroke-width="2"/>

  <!-- X eyes (the shell's own ink, not a new hue) -->
  <g stroke="#AF392D" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M25.6 15.1 L30.4 19.9"/>
    <path d="M30.4 15.1 L25.6 19.9"/>
    <path d="M33.6 15.1 L38.4 19.9"/>
    <path d="M38.4 15.1 L33.6 19.9"/>
  </g>
</svg>
