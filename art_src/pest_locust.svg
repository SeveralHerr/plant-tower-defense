<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Locust: the pest whose danger is in the CROWD rather than in itself
       (Pest.SPECIES[LOCUST]), alone it is the slowest ordinary bug on the
       board, and it only picks up speed near others of its own kind. The
       folded wings are the tell: nothing else on the road is drawn ready to
       take to the air with a column of its own. Plain, even legs on purpose,
       the opposite silhouette to the Leafhopper's coiled hind legs, so the two
       new pests never read as the same idea twice. Top-down, walks up-screen
       (-Y). Blue-grey for the wings, the shell family the Shield Bug's plate
       already uses, borrowed rather than invented, so the two "not just red"
       pests on this board read as one family of exception. -->

  <!-- legs (behind the body), plain and even -->
  <g stroke="#AF392D" stroke-width="2.3" stroke-linecap="round" fill="none">
    <path d="M24 28 L14 24"/>
    <path d="M23 36 L12 37"/>
    <path d="M25 44 L15 49"/>
    <path d="M40 28 L50 24"/>
    <path d="M41 36 L52 37"/>
    <path d="M39 44 L49 49"/>
  </g>

  <!-- antennae -->
  <g stroke="#AF392D" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M29 14 Q 24 9 20 8"/>
    <path d="M35 14 Q 40 9 44 8"/>
  </g>
  <circle cx="20" cy="8" r="1.6" fill="#AF392D"/>
  <circle cx="44" cy="8" r="1.6" fill="#AF392D"/>

  <!-- head -->
  <circle cx="32" cy="17" r="7" fill="#D24536" stroke="#AF392D" stroke-width="2"/>
  <circle cx="29" cy="15.5" r="2.1" fill="#FFFFFF"/>
  <circle cx="35" cy="15.5" r="2.1" fill="#FFFFFF"/>
  <circle cx="29" cy="15.5" r="1.05" fill="#7A2820"/>
  <circle cx="35" cy="15.5" r="1.05" fill="#7A2820"/>

  <!-- abdomen, under the folded wings -->
  <ellipse cx="32" cy="40" rx="9" ry="14" fill="#E74C3C" stroke="#AF392D" stroke-width="2"/>

  <!-- the folded wings: two long tapering cases meeting at the centreline,
       the whole reason this species reads differently from every other pest on
       the board. Symmetric by construction about x=32. -->
  <path d="M32 24 L20 30 Q 16 42 24 56 L32 52 Z"
        fill="#89A4A6" stroke="#758C8E" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32 24 L44 30 Q 48 42 40 56 L32 52 Z"
        fill="#89A4A6" stroke="#758C8E" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#758C8E" stroke-width="1.2" stroke-linecap="round" fill="none">
    <path d="M25 32 L27 50"/>
    <path d="M39 32 L37 50"/>
  </g>
</svg>
