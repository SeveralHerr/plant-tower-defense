<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Cutworm: the head of the boss. The trunk is not a sprite - it is swept along
       the road's filleted spine by cutworm.gd, so this file is the only rasterised
       part of a 953px animal.

       Sand/paper and not the pest-red every other bug wears, and that is measured:
       #E74C3C on the road's #BB8044 is 1.14:1, #ECDCB8 on the same dirt is 2.47:1.
       A 64px aphid gets away with 1.14; 960px of it is a smear on a red-brown road.
       Red is kept for the maw, where it is the threat rather than the silhouette.

       The head is 58px across - wider than the kit's 40-56px guidance for a loose
       object, and on purpose: this is the only pest that fills the 64px lane, and a
       head narrower than its own trunk would read as a bug rather than as an animal.
       That leaves exactly 2px of margin, which is why every shape below is centred
       on (32, 32) rather than on the kit's usual optical centre. -->

  <!-- head, up-screen per the kit's facing convention -->
  <circle cx="32" cy="32" r="29" fill="#ECDCB8" stroke="#A69B81" stroke-width="2"/>
  <!-- one flat highlight facet across the crown, never a gradient -->
  <path d="M8 28 Q 32 4 56 28 L 51 32 L 13 32 Z" fill="#FFEDC6"/>

  <!-- the maw: three reds descending, which is how a hole reads as deep -->
  <circle cx="32" cy="25" r="16.5" fill="#E74C3C" stroke="#AF392D" stroke-width="2"/>
  <circle cx="32" cy="25" r="11" fill="#8C2D24"/>
  <circle cx="32" cy="25" r="5.5" fill="#7A2820"/>

  <!-- eight teeth, ringing the aperture -->
  <g fill="#ECDCB8">
    <path d="M32 13.5 L35.2 20.4 L28.8 20.4 Z"/>
    <path d="M42.1 16.2 L42.6 23.8 L36.7 19.3 Z"/>
    <path d="M43.5 28.1 L36.9 30.9 L38.9 23.6 Z"/>
    <path d="M39.7 36.6 L34.3 31.3 L41.5 30 Z"/>
    <path d="M32 36.5 L28.8 29.6 L35.2 29.6 Z"/>
    <path d="M21.9 16.2 L27.3 19.3 L21.4 23.8 Z"/>
    <path d="M20.5 28.1 L25.1 23.6 L27.1 30.9 Z"/>
    <path d="M24.3 36.6 L22.5 30 L29.7 31.3 Z"/>
  </g>

  <!-- collar rings: the first two segments of the trunk, so the sprite meets the
       drawn body on the same rhythm the ring ticks use -->
  <path d="M7 43 Q 32 51 57 43" fill="none" stroke="#A69B81" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 52 Q 32 59 52 52" fill="none" stroke="#A69B81" stroke-width="2" stroke-linecap="round"/>
</svg>
