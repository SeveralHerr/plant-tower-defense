  <!-- Chomp Flower, jaw at full gape: the single frame AT the moment of the bite,
       held for BITE_SQUASH_OUT_SECONDS (0.06s) and then replaced by the eating
       sprite for the chew (see ChompFlower._bite / _show_gape_sprite).

       plant-tower-defense-81g9, the other half of a player report — "the attack
       animation for the chomp flower doesn't really look like it's taking bites out
       of the bugs". The pest's half (three visible bites, the bug shrinking as it is
       eaten) is -h4v1 and shipped first. This is the flower's: the mouth had three
       textures and none of them was OPEN. It lunged and squashed while wearing the
       same closed head it wears while chewing, so the bite had no instant.

       The three frames now read as a sequence, and each is wider at the mouth than
       the last is closed:
         idle          maw r=13, teeth tucked
         GAPE (this)   maw r=19, teeth splayed to the rim, throat wide, mouth EMPTY
         eating        maw r=16, teeth splayed, a bitten fragment inside

       Empty on purpose. The gape is the frame BEFORE anything has been taken, so a
       meal drawn in it would be a bite that already happened — and the eating frame
       is the one that carries the fragment. -->

