<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Beetle: the big pest. Chomp Flower takes a while to chew through this one. -->

  <!-- legs (behind the body) -->
  <g stroke="#5E5E5E" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M22 26 L10 20"/>
    <path d="M20 35 L7 35"/>
    <path d="M22 44 L10 50"/>
    <path d="M42 26 L54 20"/>
    <path d="M44 35 L57 35"/>
    <path d="M42 44 L54 50"/>
  </g>

  <!-- mandibles: crescent pincers curving back in toward the centreline -->
  <g fill="none" stroke="#E74C3C" stroke-width="3.6" stroke-linecap="round">
    <path d="M27 14 Q 21 9 25 4"/>
    <path d="M37 14 Q 43 9 39 4"/>
  </g>

  <!-- head -->
  <circle cx="32" cy="18" r="8" fill="#727272" stroke="#5E5E5E" stroke-width="2"/>
  <circle cx="28.5" cy="16.5" r="1.8" fill="#FFFFFF"/>
  <circle cx="35.5" cy="16.5" r="1.8" fill="#FFFFFF"/>

  <!-- carapace -->
  <ellipse cx="32" cy="37" rx="14.5" ry="15" fill="#939393" stroke="#5E5E5E" stroke-width="2"/>
  <ellipse cx="25.5" cy="32" rx="4.5" ry="7" fill="#AAAAAA"/>
  <ellipse cx="38.5" cy="32" rx="4.5" ry="7" fill="#AAAAAA"/>
  <path d="M32 23 L32 51.5" fill="none" stroke="#5E5E5E" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#727272" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M20 40 Q 26 43 29.5 44"/>
    <path d="M44 40 Q 38 43 34.5 44"/>
  </g>
</svg>
