<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Seed Sunflower: the third plant, economy not combat. Gold ring like Corn
       Cobbler (same family, same cheerful read); the disc uses the dirt/seed
       hue — it is, literally, where the seeds it grows come from. -->

  <!-- leaves poking out below the petal ring, mirrored about the vertical axis
       like Chomp Flower's (rotate(125)/rotate(55) average to the same axis). -->
  <g transform="translate(32,32)" stroke="#1F8A4C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <g transform="rotate(125)">
      <path d="M6 0 Q 18 -8 29 -1 Q 18 7 6 0 Z" fill="#2ECC71"/>
      <path d="M9 -0.5 Q 19 -2 27 -1.5" fill="none" stroke-width="1.4"/>
    </g>
    <g transform="rotate(55)">
      <path d="M6 0 Q 18 -8 29 -1 Q 18 7 6 0 Z" fill="#2ECC71"/>
      <path d="M9 -0.5 Q 19 -2 27 -1.5" fill="none" stroke-width="1.4"/>
    </g>
  </g>

  <!-- petal ring: 12 long petals -->
  <g fill="#FFCC00" stroke="#C29A00" stroke-width="2">
    <g transform="rotate(0 32 32)"><ellipse cx="32" cy="14" rx="6" ry="8"/></g>
    <g transform="rotate(30 32 32)"><ellipse cx="32" cy="14" rx="6" ry="8"/></g>
    <g transform="rotate(60 32 32)"><ellipse cx="32" cy="14" rx="6" ry="8"/></g>
    <g transform="rotate(90 32 32)"><ellipse cx="32" cy="14" rx="6" ry="8"/></g>
    <g transform="rotate(120 32 32)"><ellipse cx="32" cy="14" rx="6" ry="8"/></g>
    <g transform="rotate(150 32 32)"><ellipse cx="32" cy="14" rx="6" ry="8"/></g>
    <g transform="rotate(180 32 32)"><ellipse cx="32" cy="14" rx="6" ry="8"/></g>
    <g transform="rotate(210 32 32)"><ellipse cx="32" cy="14" rx="6" ry="8"/></g>
    <g transform="rotate(240 32 32)"><ellipse cx="32" cy="14" rx="6" ry="8"/></g>
    <g transform="rotate(270 32 32)"><ellipse cx="32" cy="14" rx="6" ry="8"/></g>
    <g transform="rotate(300 32 32)"><ellipse cx="32" cy="14" rx="6" ry="8"/></g>
    <g transform="rotate(330 32 32)"><ellipse cx="32" cy="14" rx="6" ry="8"/></g>
  </g>

  <!-- seed disc (dirt/seed hue — the plant's whole gimmick is growing seeds) -->
  <circle cx="32" cy="32" r="13" fill="#C48647" stroke="#A8723B" stroke-width="2"/>
  <ellipse cx="27.5" cy="27.5" rx="4.5" ry="3.5" fill="#D9944E"/>

  <!-- face (#8A6D00 — the same extrapolated dark-gold accent Corn Cobbler's
       face uses, so the two gold plants read as kin) -->
  <circle cx="27.5" cy="33" r="1.8" fill="#8A6D00"/>
  <circle cx="36.5" cy="33" r="1.8" fill="#8A6D00"/>
  <path d="M27.5 38 Q 32 41 36.5 38" fill="none" stroke="#8A6D00" stroke-width="2" stroke-linecap="round"/>
</svg>
