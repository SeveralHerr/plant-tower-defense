  <!-- GENERATED by tools/gen_skin_svg.py from aloe.svg, family ember. Do not edit by hand:
       run `python tools/gen_skin_svg.py` and it reports any edit the parent and the
       ember ramp do not explain. Parent geometry is copied verbatim, paint is remapped
       onto the ramp, and the family motif is the appended group at the end. -->
  <!-- Salve Aloe: the eighth plant, and the first that repairs. Every other plant in the
       catalogue points at the lane or at the seeds; this one points at the garden's own
       damage, so it should read as something you keep NEAR the fighting rather than in it.

       Drawn as a top-down ROSETTE, which is the one silhouette the kit's projection gives
       away for free — a real aloe is a rosette seen from above, so the shape that is
       botanically right is also the shape the camera already wants. It is also the only
       plant here with radial symmetry: cob, mouth, disc, pad and seed head all have a
       business end, Mint is a splayed clump, and a ring of leaves closing on a centre is
       unlike all of them at a glance.

       Palette: SAND/PAPER, not foliage. Mint's header records the finding that
       GardenTheme.LEAF is Color(0.180, 0.800, 0.443) = #2ECC71 exactly, so a green sprite
       is drawn in the lawn's own hue and disappears into it. Mint answered that with
       blue-grey and the Nettle with orange; cream is the third answer and it is the right
       one on its own terms rather than merely the next unused row — a pale succulent reads
       as soothing beside the red maw and the gold cob, which is what this plant does.

       The seed packet also uses sand, and that is not a collision: a packet is a UI card in
       the side rack and this is a 64px sprite standing on grass. They are never adjacent. -->

  <!-- Outer whorl, drawn first and widest so the inner leaves overlap its joins. Eight
       leaves rather than six: an even count reads as a rosette, and eight is what closes
       the ring at this radius without the tips touching. Each leaf is a lozenge with a
       point, which is what a succulent leaf is from above. -->
  <g transform="translate(32,32)" stroke="#EC6B40" stroke-width="2" stroke-linejoin="round" fill="#F89B7C">
    <g><path d="M0 -5 Q -8 -13 0 -23 Q 8 -13 0 -5 Z"/></g>
    <g transform="rotate(45)"><path d="M0 -5 Q -8 -13 0 -23 Q 8 -13 0 -5 Z"/></g>
    <g transform="rotate(90)"><path d="M0 -5 Q -8 -13 0 -23 Q 8 -13 0 -5 Z"/></g>
    <g transform="rotate(135)"><path d="M0 -5 Q -8 -13 0 -23 Q 8 -13 0 -5 Z"/></g>
    <g transform="rotate(180)"><path d="M0 -5 Q -8 -13 0 -23 Q 8 -13 0 -5 Z"/></g>
    <g transform="rotate(225)"><path d="M0 -5 Q -8 -13 0 -23 Q 8 -13 0 -5 Z"/></g>
    <g transform="rotate(270)"><path d="M0 -5 Q -8 -13 0 -23 Q 8 -13 0 -5 Z"/></g>
    <g transform="rotate(315)"><path d="M0 -5 Q -8 -13 0 -23 Q 8 -13 0 -5 Z"/></g>
  </g>

  <!-- Inner whorl, offset half a step so it sits in the gaps of the outer one, and in the
       light facet so the rosette has a centre rather than reading as one flat star. Five
       leaves, not eight: an odd inner count is what stops the two rings lining up into
       spokes. -->
  <g transform="translate(32,32) rotate(22)" stroke="#EC6B40" stroke-width="1.6" stroke-linejoin="round" fill="#FDC7B5">
